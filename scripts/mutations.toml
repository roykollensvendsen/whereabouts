# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/whereabouts/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a reading is kept for KEPT_DAYS and no longer"
file = "src/whereabouts/store.py"
find = 'self\.db\.execute\("DELETE FROM readings WHERE at < \?", \(time\.time\(\) - KEPT_DAYS \* 86400,\)\)'
replace = 'pass'

[[rule]]
name = "\"slett ruta\" wipes every reading at once"
file = "src/whereabouts/store.py"
find = 'gone = self\.db\.execute\("DELETE FROM readings"\)\.rowcount'
replace = 'gone = 0'

[[rule]]
name = "through the tailnet, only Roy's own login is let in"
file = "src/whereabouts/server.py"
find = 'if login and login != self\.allowed:'
replace = 'if False:'

[[rule]]
name = "the login code is shown only to the owner's own tailnet login"
file = "src/whereabouts/public.py"
find = 'if not login or login != allowed\.casefold\(\) or not secret:'
replace = 'if not secret:'

[[rule]]
name = "one call describes at most MAX_PLACES"
file = "src/whereabouts/described.py"
find = 'if len\(places\) > MAX_PLACES:'
replace = 'if False:'

[[rule]]
name = "a place's radius is kept within what a car can use"
file = "src/whereabouts/described.py"
find = '"radius_m": round\(min\(max\(radius, SMALLEST_RADIUS_M\), LARGEST_RADIUS_M\)\),'
replace = '"radius_m": round(radius),'

[[rule]]
name = "a place described again is updated, not added twice"
file = "src/whereabouts/described.py"
find = 'if same is not None:'
replace = 'if False:'

[[rule]]
name = "a note is never merged with a place or another note"
file = "src/whereabouts/described.py"
find = 'if kind == NOTE:'
replace = 'if False:'

[[rule]]
name = "news is told only until it fades"
file = "src/whereabouts/described.py"
find = '" AND \(until IS NULL OR until > \?\)",'
replace = '" AND (until IS NULL OR until > ? OR 1)",'

[[rule]]
name = "only what lies along the route is kept from the boxes"
file = "src/whereabouts/geo.py"
find = 'and any\(metres_between\(point, \*centre\) <= ALONG_METRES for point in here\)'
replace = 'and True'

[[rule]]
name = "a pretend drive is never kept in the route"
file = "src/whereabouts/server.py"
find = 'pretending\.update\(latitude=latitude, longitude=longitude, at=time\.time\(\)\)'
replace = 'route.add(geo.Fix(latitude, longitude, None, None, time.time())); pretending.update(latitude=latitude, longitude=longitude, at=time.time())'

[[rule]]
name = "a side road is placed where it meets the route"
file = "src/whereabouts/geo.py"
find = 'return min\(vertices, key=lambda v: min\(_apart\(v, p\) for p in points\)\)'
replace = 'return vertices[0]'

[[rule]]
name = "what lies behind higher ground or forest cannot be seen"
file = "src/whereabouts/view.py"
find = 'if math\.atan2\(z \+ TARGET - eyes, metres\) >= highest:'
replace = 'if True:'
